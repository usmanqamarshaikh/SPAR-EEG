name: Smoke tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      MPLCONFIGDIR: ${{ github.workspace }}/.mplconfig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Static release audit
        run: python tests/smoke_python.py && python tests/check_release.py
      - name: Numerical smoke test
        run: python tests/test_core_python.py
